# Qwen3-8B KV cache compression config (dense, all layers uniform)

model:
  name: "Qwen/Qwen3-8B"
  num_layers: 36
  full_attention_interval: null  # all layers are softmax attention

kv_cache:
  method: "turboquant_prod"
  bit_width: 4
  kv_heads: 8
  head_dim: 128
  compressible_layers: 36       # all layers have KV cache
